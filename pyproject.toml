[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'generative_redfoot'
dynamic = ['version']  # read from src/generative_redfoot/__init__.py
dependencies = [
    'pyyaml',
    'jinja2',
    'click',
    'wordloom>=0.10.1',
    'mlx-lm>=0.32.2',  # brings in mlx (Darwin only) and transformers
    'fastapi',
    'uvicorn',
    'python-multipart',  # needed by fastapi for form/file uploads
]
description = 'A generative, conversational workflow and multi-agent system using PDL and mlx'
readme = 'README.md'
requires-python = '>=3.12'
license = {file = 'LICENSE'}
keywords = ['llm', 'pdl', 'prompt declaration language', 'mlx', 'wordloom', 'prompt programming']
authors = [
  { name = 'Chimezie Ogbuji', email = 'chimezie@gmail.com' }
]

classifiers = [
  'Development Status :: 4 - Beta',
  'Programming Language :: Python',
  'Operating System :: MacOS',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: Implementation :: CPython',
]

[tool.hatch.version]
path = 'src/generative_redfoot/__init__.py'

[tool.hatch.build.targets.wheel]
packages = ['src/generative_redfoot']

[project.scripts]
generative_redfoot = 'generative_redfoot.cli:main'

[project.urls]
Homepage = 'https://github.com/chimezie/generative_redfoot'
Repository = 'https://github.com/chimezie/generative_redfoot'
Changelog = 'https://github.com/chimezie/generative_redfoot/blob/main/CHANGELOG.md'

[project.optional-dependencies]
pdf = ['pymupdf']
gemma_aps = ['nltk']
dev = ['pytest', 'ruff', 'httpx', 'pymupdf']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['integration: needs MLX hardware, model downloads, or other unowned services']
addopts = '-m "not integration"'

[tool.ruff]
target-version = 'py312'
line-length = 120

[tool.ruff.lint]
# Comprehensive suite: Style (E/W), Logic (F), Imports (I), Naming (N),
# Modern Python (UP), Bugbear (B), Quotes (Q), and Security (S)
select = [
    'E', 'W',
    'F',
    'I',
    'N',
    'UP',
    'B',
    'Q',
    'S'
]

ignore = [
    # Format-friendly spacing (avoids clashes with formatters)
    'E203',
    'E231',
    # Allow empty methods in abstract base classes
    'B027',
    # Allow boolean positional values in function calls like dict.get(..., True)
    'FBT003',
    # Relax strict module naming for legacy directory structures
    'N999',
    'N813',
]

# Safety net: Never let Ruff auto-delete code it *thinks* is unused
unfixable = [
    'F401',
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'single'
docstring-quotes = 'single'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
known-first-party = ['generative_redfoot']

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.per-file-ignores]
# Test flexibility: Allow assertions, magic values, relative imports, and long lines in tests
'tests*/**/*' = ['PLR2004', 'S101', 'S105', 'S106', 'S603', 'TID252', 'E501']
'conftest.py' = ['S101']

# Package initializers: Allow top-level import ordering exceptions
'__init__.py' = ['E402']

# Notebooks: Allow long lines in Jupyter cells
'*.ipynb' = ['E501']
