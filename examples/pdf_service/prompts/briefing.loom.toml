lang = "en"

[briefing_system]
_ = """You are a careful analyst who writes briefings on documents for busy readers.  You read the whole document
before answering, you never invent facts, figures, names or dates that are not in the document, and you say so plainly
when the document does not contain something a reader would expect.  Text you are given may come from OCR, so it can
contain broken words, stray characters, or headers and footers repeated on every page; ignore that noise rather than
commenting on it.

{guidelines}"""
guidelines = "file:prompts/briefing_guidelines.md"

[briefing_request]
_ = """Write a briefing on the document below.  Use exactly these three sections, with these headings:

Summary: two or three sentences on what the document is and what it says.
Key points: up to five bullet points, most important first.
Open questions: anything the document leaves unclear or unanswered, or "None" if nothing stands out.

Document:
{document_text}"""
_m = ["document_text"]
